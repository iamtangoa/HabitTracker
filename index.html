<style>

.wk{font-size:11px;font-weight:700;padding:5px;border-radius:6px;letter-spacing:.05em}
.dn{font-size:10px;color:var(--mu);line-height:1.1}
.dd,.dm{background:none;border:0;padding:2px;color:var(--mu);font-size:10px;line-height:1.15;min-width:23px}

.cb:hover{opacity:1}
.cb.on{background:var(--c);opacity:1;box-shadow:0 0 8px var(--c)}
.cb.on::before{content:"✓";color:#070914;font:800 13px/16px sans-serif}

.cb.today{outline:2px solid var(--tx);outline-offset:1px}

.wide{grid-column:1/-1}

textarea{min-height:90px;resize:vertical}

.je{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.jd{color:var(--mu);font-size:11px;margin-right:6px}.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}

.chip.act,.act{border-color:#2f7bff;background:#2f7bff33}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.mood{font-size:20px;padding:4px 8px}

details summary{cursor:pointer;margin-top:10px;font-weight:600}.re{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin:4px 0}.re button{padding:0 6px;margin-left:auto}.dd.fri{color:var(--bad)}
.cb.on.part{background:linear-gradient(to top,var(--c) var(--pp),transparent var(--pp))}.cb.on.part::before{content:""}
#li{display:grid;gap:6px;margin:10px 0}.li{text-align:left;padding:10px 12px}.li::before{content:"○ ";color:var(--mu)}.li.act::before{content:"● ";color:var(--good)}
.scr{font-weight:700;margin-top:8px}
</style></head><body>

</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COL=["#2f7bff","#37e05a","#ff2e8a","#ffb020","#b6e03a"],WK=["Week 1","Week 2","Week 3","Week 4","Week 5"],MOODS=["😞","😕","🙂","😄","🤩"];
const QUOTES=["Small steps, every day.","Don't break the chain.","You are what you repeatedly do.","Show up, even badly.","Consistency beats intensity."];
const JM=["Farvardin","Ordibehesht","Khordad","Tir","Mordad","Shahrivar","Mehr","Aban","Azar","Dey","Bahman","Esfand"];
const WDJ=["ی","د","س","چ","پ","ج","ش"],WDG=["S","M","T","W","T","F","S"];
const rid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=v=>String(Math.round(v*10)/10),sc10=p=>fmt(p*10)+"/10";
/* sub-habit syntax: plain=counts | Name: 4000 IU = dose | *Name = required for tick | ~Name = extra (no tick) | -Name = harm (subtracts) */
function parseItems(txt){return txt.split("\n").map(l=>l.trim()).filter(Boolean).slice(0,30).map(l=>{const f=l[0],r=l.slice(1).trim();
 if(f==="*")return{n:r,t:"g"};if(f==="~")return{n:r,t:"x"};if(f==="-")return{n:r,t:"b"};
 const m=l.match(/^(.+?)\s*[:=]\s*([\d.]+)\s*(\S*)$/);if(m)return{n:m[1].trim(),t:"d",rec:parseFloat(m[2]),unit:m[3]||""};return{n:l,t:"c"}}).filter(i=>i.n)}
const itemLine=i=>i.t==="g"?"*"+i.n:i.t==="x"?"~"+i.n:i.t==="b"?"-"+i.n:i.t==="d"?i.n+": "+i.rec+(i.unit?" "+i.unit:""):i.n;
const PRE=[
["Workout","w",4,"s",0,"Gym\nRunning\nSwimming\nHomeGym"],
["Mental Maintenance","w",7,"s",0,"Meditate 20 min\nGrateful + Imagination 12 min\nBeliefs Maintenance\nLucky\nWorthy action\nSixth Sense"],
["Boat in the Sea","w",4,"s",1,"*20+ miles from shore\n~Fixed something on the beach\n~Bought tools / supplies\n~Technical work"],
["Sleep Ritual","w",7,"a",0,"5 min morning sun (sleep reset)\nNo workout after dark (if possible)\nShower after dark\nNo food 3.5 h before bed\nNo drinks 3 h before bed\nNo screens 1 h before bed\nNight glasses after shower\nMagnesium glycinate"],
["Nutrients","w",7,"a",0,"Vitamin D3: 4000 IU\nZinc\nB1\nK2\nProtein\nHealthy fat\n-Junk / harmful intake"],
["Skincare","w",7,"a",0,"Brushed teeth\nFace wash\nMoisturizer\nSunscreen\n-Blemish / acne / dark circles"],
["Learn + Practice + Action","w",5,"a",0,"Trade: learn\nTrade: practice (simulated)\nTrade: real action"],
["Read Books","w",5,"s",0,"5 min at least\n25 minutes"]];
const mkPre=()=>PRE.map((p,i)=>({id:"p"+i,n:p[0],per:p[1],t:p[2],sm:p[3],ax:!!p[4],items:parseItems(p[5]),from:"",arch:null}));
const fresh=()=>({v:3,cal:"j",habits:mkPre(),log:{},dn:{},mn:{},updated:0,synced:0});
function migrate(o){const n={v:2,habits:(o.habits||[]).map((x,i)=>({id:"h"+i,n:x.n,per:"m",t:x.g||20,kind:"c",from:0,arch:null})),log:{},dn:{},mn:o.notes||{}};
 for(const k in o.log||{}){n.log[k]={};for(const i in o.log[k]){const m={};for(const d in o.log[k][i])if(o.log[k][i][d])m[d]={s:"d"};n.log[k]["h"+i]=m}}return n}
function up(s){s=s||{};if(!s.v||s.v<2)s=migrate(s);
 if(s.v<3){const g=(Y,M,d)=>Y+"-"+pad(M+1)+"-"+pad(d),lg={},dn={},mn={},old=s.habits||[];
  for(const k in s.log||{}){const[Y,M]=k.split("-").map(Number);for(const h in s.log[k])for(const d in s.log[k][h])(lg[h]=lg[h]||{})[g(Y,M,+d)]=s.log[k][h][d]}
  for(const k in s.dn||{}){const[Y,M]=k.split("-").map(Number);for(const d in s.dn[k])dn[g(Y,M,+d)]=s.dn[k][d]}
  for(const k in s.mn||{})mn["g:"+k]=s.mn[k];
  const cv=v=>typeof v==="number"?(v?g(Math.floor(v/12),v%12,1):""):(v||"");
  const dflt=old.length>0&&old.every(h=>/^d\d$/.test(h.id));
  const hs=old.map(h=>{const o={id:h.id,n:h.n,per:h.per,t:h.t,sm:"a",ax:false,items:[],from:cv(h.from),arch:h.arch==null?null:cv(h.arch)};
   if(h.kind==="l")o.items=(h.items||[]).map(n=>({n,t:"c"}));
   if(h.kind==="a"){o.items=[{n:h.n,t:"d",rec:h.amt||1,unit:h.unit||""}];for(const d in lg[h.id]||{}){const c=lg[h.id][d];if(typeof c.a==="number")c.a={[h.n]:c.a}}}
   return o});
  if(dflt){hs.forEach(h=>h.arch="2000-01-01");hs.push(...mkPre())}
  s={v:3,cal:"j",habits:hs,log:lg,dn,mn,updated:s.updated||0,synced:s.synced||0}}
 s.cal=s.cal||"j";s.habits=s.habits||[];s.log=s.log||{};s.dn=s.dn||{};s.mn=s.mn||{};s.updated=s.updated||0;s.synced=s.synced||0;return s}
const norm=up;
let S,migrated=false;
try{let r=localStorage.getItem("habit-v3");if(r)S=up(JSON.parse(r));else{r=localStorage.getItem("habit-v2")||localStorage.getItem("habit-v1");if(r){S=up(JSON.parse(r));migrated=true}else S=fresh()}}catch(e){S=fresh()}
const persist=()=>{try{localStorage.setItem("habit-v3",JSON.stringify(S))}catch(e){}};
const touch=()=>{S.updated=Date.now();persist();sched()};
const save=()=>{touch();render()};
if(migrated)persist();
/* ---------- calendar (Jalali default, Gregorian optional) ---------- */
const JF=new Intl.DateTimeFormat("en-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
function jp(dt){const o={};JF.formatToParts(dt).forEach(p=>{o[p.type]=p.value});return{y:+(o.year||o.relatedYear),m:+o.month,d:+o.day}}
const noon=(y,m,d)=>new Date(y,m,d,12);
function curYM(dt){if(S.cal==="g")return[dt.getFullYear(),dt.getMonth()];const p=jp(dt);return[p.y,p.m-1]}
function build(y,m){let st,n;
 if(S.cal==="g"){st=noon(y,m,1);n=new Date(y,m+1,0).getDate()}
 else{st=noon(y+621,2,21);st.setDate(st.getDate()+Math.round(m*30.44));
  for(let i=0;i<20;i++){const p=jp(st),dm=(y*12+m)-(p.y*12+p.m-1);if(!dm&&p.d===1)break;st.setDate(st.getDate()+(dm>0?32-p.d:dm<0?-p.d:1-p.d))}
  n=0;const g=new Date(st);while(jp(g).m-1===m&&n<32){n++;g.setDate(g.getDate()+1)}}
 const iso=[null],dow=[null];for(let d=1;d<=n;d++){const x=new Date(st);x.setDate(st.getDate()+d-1);iso.push(isoOf(x));dow.push(x.getDay())}
 return{y,m,n,iso,dow,mname:S.cal==="g"?new Date(y,m,1).toLocaleString("en",{month:"long"}):JM[m]}}
let V,vy,vm,CALV=S.cal;
function setView(y,m){vy=y;vm=m;V=build(y,m)}
function reView(){CALV=S.cal;const q=curYM(new Date());setView(q[0],q[1])}
reView();
const todayD=()=>Math.max(0,V.iso.indexOf(isoOf(new Date())));
const isCur=()=>todayD()>0;
const nk=()=>S.cal+":"+vy+"-"+vm;
const act=()=>S.habits.filter(h=>(h.from||"")<=V.iso[V.n]&&(h.arch==null||V.iso[1]<h.arch));
let tab="w",reorder=false;const SN={w:"Weekly",m:"Monthly",y:"Yearly"};
const getCell=(h,d)=>(S.log[h]||{})[V.iso[d]];
function setK(h,k,v){if(!v||(!v.s&&!v.n&&!v.t&&!(v.k&&v.k.length)&&!v.a&&!v.bd)){if(S.log[h])delete S.log[h][k];return}(S.log[h]=S.log[h]||{})[k]=v}
const setCell=(h,d,v)=>setK(h,V.iso[d],v);
function pcell(h,rs,re){const m=S.log[h]||{};for(const k in m)if(k>=rs&&k<=re)return[k,m[k]];return[rs,null]}
function ptap(h,rs,re){const[k,c]=pcell(h,rs,re);if(c&&c.s)setK(h,k,c.n?{n:c.n}:null);else setK(h,k,Object.assign({},c,{s:"d"}))}
function dstr(iso){if(S.cal==="g")return iso;const p=jp(new Date(iso+"T12:00:00"));return p.d+" "+JM[p.m-1]+" "+p.y}
const mvb=id=>`<span class="mv"><button data-mv="${id}|-1">▲</button><button data-mv="${id}|1">▼</button></span>`;
function move(id,dir){const x=S.habits.find(q=>q.id===id);if(!x)return;const sec=x.sec||"d",pe=act().filter(h=>(h.sec||"d")===sec),i=pe.findIndex(q=>q.id===id),j=i+dir;if(j<0||j>=pe.length)return;
 const a=S.habits.indexOf(pe[i]),b=S.habits.indexOf(pe[j]);[S.habits[a],S.habits[b]]=[S.habits[b],S.habits[a]];save()}
const isD=(h,d)=>{const c=getCell(h,d);return !!(c&&c.s==="d")};
const val=(h,d)=>{const c=getCell(h,d);return c&&c.s==="d"?(c.p==null?1:c.p):0};
function tap(h,d){const c=getCell(h,d);if(c&&c.s)setCell(h,d,c.n?{n:c.n}:null);else setCell(h,d,Object.assign({},c,{s:"d"}))}
function cellLabel(h,c){return c&&c.s==="d"&&c.p!=null?sc10(c.p):""}
function quick(hid,d){const x=S.habits.find(q=>q.id===hid);if(!x)return;if(!(x.items||[]).length){tap(hid,d);save()}else openCell(hid,d)}
function stats(h,n){let raw=0,cap=0,goal=0,days=0;const wks=[],r2=v=>Math.round(v*100)/100;

 $("ds").onclick=()=>{const k=V.iso[d],nn=$("dnt").value.trim();if(!m&&!nn)delete S.dn[k];else S.dn[k]={m,n:nn};dlg.close();save()};
 paint();dlg.showModal()}
/* ---------- events ---------- */
const TB=$("t");let lp=null,lpFired=false;
TB.addEventListener("pointerdown",e=>{const b=e.target.closest(".cb");if(!b)return;lpFired=false;clearTimeout(lp);lp=setTimeout(()=>{lpFired=true;openCell(b.dataset.h,+b.dataset.d)},500)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>TB.addEventListener(ev,()=>clearTimeout(lp)));
TB.addEventListener("contextmenu",e=>{const b=e.target.closest(".cb");if(!b)return;e.preventDefault();clearTimeout(lp);lpFired=true;openCell(b.dataset.h,+b.dataset.d)});
TB.addEventListener("click",e=>{const b=e.target.closest(".cb");if(!b)return;if(lpFired){lpFired=false;return}quick(b.dataset.h,+b.dataset.d)});
document.addEventListener("click",e=>{const t=e.target;let b;
 if(t.closest("[data-close]")){dlg.close();return}
 if(b=t.closest("[data-edit]")){openHabit(b.dataset.edit);return}
 if(b=t.closest("[data-day]")){openDay(+b.dataset.day);return}
 if(b=t.closest("[data-tab]")){tab=b.dataset.tab;render();return}
 if(b=t.closest("[data-mv]")){const q=b.dataset.mv.split("|");move(q[0],+q[1]);return}
 if(b=t.closest("[data-jf]")){jf=b.dataset.jf;render();return}
 if(b=t.closest("[data-jh]")){openCell(b.dataset.jh,+b.dataset.jd);return}
 if(b=t.closest("[data-rs]")){const x=S.habits.find(q=>q.id===b.dataset.rs);if(x){x.arch=null;save()}return}
 if(b=t.closest("[data-del]")){delHabit(b.dataset.del)}});
$("notes").addEventListener("input",e=>{S.mn[nk()]=e.target.value;touch()});
$("prev").onclick=()=>{let y=vy,m=vm-1;if(m<0){m=11;y--}setView(y,m);render()};
$("next").onclick=()=>{let y=vy,m=vm+1;if(m>11){m=0;y++}setView(y,m);render()};
$("add").onclick=()=>openHabit(null);
$("ro").onclick=()=>{reorder=!reorder;render()};
const SD=$("side");let lp2=null,lp2f=false;const pbx=e=>e.target.closest("[data-ph]");
const openP=b=>{const k=pcell(b.dataset.ph,b.dataset.pa,b.dataset.pb)[0];openCellK(b.dataset.ph,k,b.dataset.pl+" · "+dstr(b.dataset.pa)+" → "+dstr(b.dataset.pb))};
SD.addEventListener("pointerdown",e=>{const b=pbx(e);if(!b)return;lp2f=false;clearTimeout(lp2);lp2=setTimeout(()=>{lp2f=true;openP(b)},500)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>SD.addEventListener(ev,()=>clearTimeout(lp2)));
SD.addEventListener("contextmenu",e=>{const b=pbx(e);if(!b)return;e.preventDefault();clearTimeout(lp2);lp2f=true;openP(b)});
SD.addEventListener("click",e=>{const b=pbx(e);if(!b)return;if(lp2f){lp2f=false;return}const x=S.habits.find(q=>q.id===b.dataset.ph);if(!x)return;if((x.items||[]).length)openP(b);else{ptap(x.id,b.dataset.pa,b.dataset.pb);save()}});
$("calb").onclick=()=>{const mid=new Date(V.iso[Math.min(15,V.n)]+"T12:00:00");S.cal=S.cal==="j"?"g":"j";CALV=S.cal;const q=curYM(mid);setView(q[0],q[1]);save()};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="habit-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.habits))throw 0;if(!confirm("Replace current data with this backup?"))return;S=up(d);save()}catch(x){alert("Not a valid backup file.")}};r.readAsText(f);e.target.value=""};
/* ---------- cloud sync (Firebase: email + Google) ---------- */
let fb=false,auth=null,db=null,user=null,unsub=null,pushT=null,state="";
const cfgOk=()=>{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&!String(c.apiKey).startsWith("PASTE"))};
function setStat(t){if(t)state=t;$("sync").textContent=!cfgOk()?"☁ Set up sync":user?(state||"☁ Synced"):(fb?"☁ Sign in":"☁ Sync")}
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
async function initFB(){if(fb||!cfgOk())return fb;
 try{const b="https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js");
  firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();fb=true;auth.onAuthStateChanged(onUser)}
 catch(e){fb=false;setStat("☁ Offline")}return fb}
const ref=()=>db.collection("habitTracker").doc(user.uid);
function onUser(u){user=u;if(unsub){unsub();unsub=null}if(!u){setStat();return}setStat("☁ Syncing…");reconcile().then(()=>{unsub=ref().onSnapshot(snap=>{
  if(snap.metadata.hasPendingWrites||!snap.exists)return;const d=snap.data();
  if(d.updated>S.updated){if(S.updated<=S.synced)takeRemote(d);else reconcile()}},()=>{})})}
function takeRemote(d){S=norm(JSON.parse(d.data));S.updated=d.updated;S.synced=d.updated;persist();render()}
function merge(L,R){const o=norm(JSON.parse(JSON.stringify(R)));
 L.habits.forEach(h=>{const i=o.habits.findIndex(x=>x.id===h.id);if(i<0)o.habits.push(h);else o.habits[i]=h});
 for(const h in L.log)for(const d in L.log[h]){(o.log[h]=o.log[h]||{})[d]=L.log[h][d]}
 Object.assign(o.dn,L.dn);Object.assign(o.mn,L.mn);o.cal=L.cal;return o}
async function reconcile(){if(!user||!db)return;
 if(!navigator.onLine){setStat("☁ Offline");return}
 try{const snap=await ref().get();
  if(!snap.exists){await push();return}
  const d=snap.data(),ru=d.updated||0,lu=S.updated||0,ls=S.synced||0;
  if(ru===lu){S.synced=lu;persist()}
  else if(ru>lu&&lu<=ls)takeRemote(d);
  else if(lu>ru&&ru<=ls)await push();
  else{S=merge(S,JSON.parse(d.data));S.updated=Date.now();persist();render();await push()}
  setStat("☁ Synced")}catch(e){setStat("☁ Offline")}}
async function push(){if(!user||!db)return;if(!navigator.onLine){setStat("☁ Offline");return}
 setStat("☁ Syncing…");const u=S.updated;
 try{await ref().set({data:JSON.stringify(S),updated:u});if(S.synced<u)S.synced=u;persist();setStat("☁ Synced")}catch(e){setStat("☁ Offline")}}
function sched(){if(!user)return;clearTimeout(pushT);pushT=setTimeout(push,1500)}
window.addEventListener("online",()=>{if(user)reconcile();else initFB()});
window.addEventListener("offline",()=>{if(user)setStat("☁ Offline")});
async function openSync(){if(dlg.open)return;
 if(!cfgOk()){dlg.innerHTML=`<h3>Cloud sync</h3><p>Sync isn't set up yet. Open <b>firebase-config.js</b>, paste your Firebase web-app config, and re-upload it to GitHub. Step-by-step instructions are in <b>README.md</b>.</p><div class="row"><button data-close>OK</button></div>`;dlg.showModal();return}
 if(!fb)await initFB();
 if(!fb){dlg.innerHTML=`<h3>Cloud sync</h3><p>Can't reach the sync service right now (offline?). Your data is safe on this device and will sync when you're back online.</p><div class="row"><button data-close>OK</button></div>`;dlg.showModal();return}
 if(user){dlg.innerHTML=`<h3>Cloud sync</h3><p>Signed in as <b>${esc(user.email||user.displayName||"your account")}</b><br><span class="mu">${esc(state||"☁ Synced")} · changes upload automatically</span></p><div class="row"><button class="pri" id="sn">Sync now</button><button id="so">Sign out</button><button data-close>Close</button></div>`;
  $("sn").onclick=async()=>{dlg.close();await reconcile()};$("so").onclick=async()=>{await auth.signOut();dlg.close()}}
 else{dlg.innerHTML=`<h3>Sign in to sync</h3><div class="mu">Use the same account on every device.</div>
  <label>Email<input id="ae" type="email" autocomplete="email"></label><label>Password<input id="ap" type="password" autocomplete="current-password"></label>
  <div class="row"><button class="pri" id="a1">Sign in</button><button id="a2">Create account</button></div>
  <div class="row"><button id="a3">Continue with Google</button><button id="a4">Forgot password</button><button data-close>Cancel</button></div><div class="mu" id="am"></div>`;
  const em=()=>$("ae").value.trim(),pw=()=>$("ap").value;
  const run=async f=>{try{$("am").textContent="Working…";await f();dlg.close()}catch(e){$("am").textContent=String(e.message||e).replace("Firebase: ","")}};
  $("a1").onclick=()=>run(()=>auth.signInWithEmailAndPassword(em(),pw()));
  $("a2").onclick=()=>run(()=>auth.createUserWithEmailAndPassword(em(),pw()));
  $("a3").onclick=()=>run(()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()));
  $("a4").onclick=async()=>{try{await auth.sendPasswordResetEmail(em());$("am").textContent="Password reset email sent."}catch(e){$("am").textContent=String(e.message||e).replace("Firebase: ","")}}}
 dlg.showModal()}
$("sync").onclick=openSync;
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
if(cfgOk())initFB();
</script></body></html>
